<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trainer Store - Inventory Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Sample Default Data
    const initialInventory = [
      { id: 1, name: 'Whey Protein (2kg)', category: 'Supplements', price: 4500, stock: 12 },
      { id: 2, name: 'Creatine Monohydrate', category: 'Supplements', price: 999, stock: 5 },
      { id: 3, name: 'Lifting Straps', category: 'Gear', price: 499, stock: 25 },
      { id: 4, name: 'Gym Shaker Bottle', category: 'Accessories', price: 299, stock: 2 }
    ];

    function App() {
      const [items, setItems] = useState(() => {
        const saved = localStorage.getItem('trainer_inventory');
        return saved ? JSON.parse(saved) : initialInventory;
      });

      const [name, setName] = useState('');
      const [category, setCategory] = useState('Supplements');
      const [price, setPrice] = useState('');
      const [stock, setStock] = useState('');
      const [searchTerm, setSearchTerm] = useState('');

      useEffect(() => {
        localStorage.setItem('trainer_inventory', JSON.stringify(items));
      }, [items]);

      // Handle Add Item
      const handleAddItem = (e) => {
        e.preventDefault();
        if (!name || !price || !stock) return alert('कृपया सभी फ़ील्ड भरें!');

        const newItem = {
          id: Date.now(),
          name,
          category,
          price: parseFloat(price),
          stock: parseInt(stock, 10)
        };

        setItems([...items, newItem]);
        setName('');
        setPrice('');
        setStock('');
      };

      // Handle Stock Increment / Decrement
      const updateStock = (id, change) => {
        setItems(items.map(item => {
          if (item.id === id) {
            const newStock = item.stock + change;
            return { ...item, stock: newStock < 0 ? 0 : newStock };
          }
          return item;
        }));
      };

      // Delete Item
      const deleteItem = (id) => {
        if (confirm('क्या आप इस आइटम को हटाना चाहते हैं?')) {
          setItems(items.filter(item => item.id !== id));
        }
      };

      // Dashboard Calculations
      const totalItems = items.length;
      const lowStockItems = items.filter(i => i.stock <= 3).length;
      const totalInventoryValue = items.reduce((acc, curr) => acc + (curr.price * curr.stock), 0);

      // Filtered items by search
      const filteredItems = items.filter(item =>
        item.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
        item.category.toLowerCase().includes(searchTerm.toLowerCase())
      );

      return (
        <div class="min-h-screen flex flex-col">
          <header class="bg-indigo-700 text-white py-4 px-6 shadow-md">
            <div class="max-w-6xl mx-auto flex justify-between items-center">
              <h1 class="text-2xl font-bold">💪 Trainer Store Inventory</h1>
              <span class="text-sm bg-indigo-800 px-3 py-1 rounded-full">Pro Dashboard</span>
            </div>
          </header>

          <main class="flex-1 max-w-6xl w-full mx-auto p-6 space-y-6">
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
              <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                <p class="text-sm text-gray-500 font-semibold uppercase">कुल प्रोडक्ट्स (Total Items)</p>
                <h2 class="text-3xl font-extrabold text-indigo-600 mt-2">{totalItems}</h2>
              </div>
              <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                <p class="text-sm text-gray-500 font-semibold uppercase">लो स्टॉक अलर्ट (Low Stock &le; 3)</p>
                <h2 class={`text-3xl font-extrabold mt-2 ${lowStockItems > 0 ? 'text-red-500' : 'text-green-600'}`}>
                  {lowStockItems}
                </h2>
              </div>
              <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                <p class="text-sm text-gray-500 font-semibold uppercase">कुल इन्वेंटरी वैल्यू (Total Value)</p>
                <h2 class="text-3xl font-extrabold text-emerald-600 mt-2">₹{totalInventoryValue.toLocaleString()}</h2>
              </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
              <h2 class="text-lg font-bold text-gray-700 mb-4">नया प्रोडक्ट जोड़ें (Add New Item)</h2>
              <form onSubmit={handleAddItem} class="grid grid-cols-1 md:grid-cols-5 gap-4">
                <input
                  type="text"
                  placeholder="आइटम का नाम (e.g. Whey Protein)"
                  class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                  value={name}
                  onChange={e => setName(e.target.value)}
                  required
                />
                <select
                  class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                  value={category}
                  onChange={e => setCategory(e.target.value)}
                >
                  <option value="Supplements">Supplements</option>
                  <option value="Gear">Gear & Equipment</option>
                  <option value="Accessories">Accessories</option>
                  <option value="Apparel">Apparel (कपड़े)</option>
                </select>
                <input
                  type="number"
                  placeholder="कीमत (₹)"
                  class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                  value={price}
                  onChange={e => setPrice(e.target.value)}
                  min="0"
                  required
                />
                <input
                  type="number"
                  placeholder="स्टॉक मात्रा (Stock Qty)"
                  class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                  value={stock}
                  onChange={e => setStock(e.target.value)}
                  min="0"
                  required
                />
                <button
                  type="submit"
                  class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg transition"
                >
                  + जोड़ें (Add Item)
                </button>
              </form>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
              <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <h2 class="text-lg font-bold text-gray-700">स्टॉक सूची (Inventory List)</h2>
                <input
                  type="text"
                  placeholder="खोजें (Search item/category)..."
                  class="px-4 py-1.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500 w-64"
                  value={searchTerm}
                  onChange={e => setSearchTerm(e.target.value)}
                />
              </div>

              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="bg-gray-100 text-gray-600 text-xs font-semibold uppercase border-b">
                      <th class="p-4">प्रोडक्ट</th>
                      <th class="p-4">कैटेगरी</th>
                      <th class="p-4">कीमत (₹)</th>
                      <th class="p-4">स्टॉक स्टेटस</th>
                      <th class="p-4 text-center">स्टॉक बदलें</th>
                      <th class="p-4 text-right">एक्शन</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-gray-200 text-sm">
                    {filteredItems.length === 0 ? (
                      <tr>
                        <td colSpan="6" class="p-6 text-center text-gray-400">कोई डेटा उपलब्ध नहीं है।</td>
                      </tr>
                    ) : (
                      filteredItems.map(item => (
                        <tr key={item.id} class="hover:bg-gray-50">
                          <td class="p-4 font-semibold text-gray-800">{item.name}</td>
                          <td class="p-4">
                            <span class="bg-gray-200 text-gray-700 text-xs px-2.5 py-1 rounded-full">
                              {item.category}
                            </span>
                          </td>
                          <td class="p-4">₹{item.price.toLocaleString()}</td>
                          <td class="p-4">
                            {item.stock <= 3 ? (
                              <span class="bg-red-100 text-red-700 text-xs font-semibold px-2.5 py-1 rounded-full">
                                Low Stock: {item.stock}
                              </span>
                            ) : (
                              <span class="bg-green-100 text-green-700 text-xs font-semibold px-2.5 py-1 rounded-full">
                                In Stock: {item.stock}
                              </span>
                            )}
                          </td>
                          <td class="p-4 text-center space-x-2">
                            <button
                              onClick={() => updateStock(item.id, -1)}
                              class="px-2.5 py-1 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded font-bold"
                            >
                              -
                            </button>
                            <span class="font-bold w-6 inline-block">{item.stock}</span>
                            <button
                              onClick={() => updateStock(item.id, 1)}
                              class="px-2.5 py-1 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded font-bold"
                            >
                              +
                            </button>
                          </td>
                          <td class="p-4 text-right">
                            <button
                              onClick={() => deleteItem(item.id)}
                              class="text-red-500 hover:text-red-700 font-semibold"
                            >
                              हटाएं
                            </button>
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
